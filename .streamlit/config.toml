# Colores de clivi.com.mx (azul petróleo #00547A) con grises teñidos de azul; Inter para texto y Manrope para títulos.
[theme]
primaryColor = "#00547a"
backgroundColor = "#f5f8f9"
secondaryBackgroundColor = "#eef4f6"
textColor = "#0e2a36"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap"
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
borderColor = "#dbe6ea"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f2f6f8"
